# -----------------------------------------------------------------------------#
#  DonutOrders - Main configuration                                             #
# -----------------------------------------------------------------------------#
#
#  This file ONLY controls behaviour.
#    * Text     -> lang/<language>.yml   (menu titles, buttons, item names)
#    * Menu layout -> menus/*.yml        (slot, material, sound, open/close)
#
#  New settings are added to this file automatically on version upgrades; you
#  never need to delete a file, and any changes you make are preserved.
#
#  After changing anything: /donutordersadmin reload
# -----------------------------------------------------------------------------#

# Prefix shown before messages. Set to "" to leave it empty.
prefix: ""

# =============================================================================
#  LANGUAGE
# =============================================================================
# Server default language. The file name inside the lang/ folder (tr, en, ...).
# If you set "auto", the server machine's language is used.
language: tr

# Should each player use their own language?
#   true  -> the language chosen with /orderlang, or the client's Minecraft
#            language if they haven't chosen one
#   false -> everyone sees the "language" value above
per-player-language: true

# Maps a Minecraft client language to your own language file (optional).
# Example: the client sends "en_pt" but you only have pt_BR.yml.
locale-map: {}
#  en_pt: pt_BR
#  az: tr

# =============================================================================
#  ORDER RULES
# =============================================================================
orders:
  # How many active orders a single player can have at once.
  # -1 = unlimited. The orders.unlimited permission always grants unlimited.
  max-active-per-player: 10

  # Limit by rank. For a player with permission, the HIGHEST value applies,
  # so granting a second permission never restricts a player.
  rank-limits:
    orders.limit.vip: 25
    orders.limit.mvp: 50

  # Minimum / maximum price per item. -1 for the upper bound = unlimited.
  min-price-per-item: 0.01
  max-price-per-item: -1

  # Minimum / maximum quantity per order. -1 = unlimited.
  min-amount: 1
  max-amount: -1

  # How long an order stays valid (hours). 168 = 7 days.
  expiry-hours: 168

  # Orders that a player holding this permission has AT THE MOMENT THEY CREATE
  # THEM never expire. The permission is checked at creation time and baked
  # into the order; even if the player later loses the rank, that order
  # remains permanent.
  expire-bypass-permission: "orders.bypass.expire"

  # How long a completed order waits before its items are collected (hours).
  completed-retention-hours: 168

  # Maximum number of enchantments per enchanted-item order. -1 = unlimited.
  max-enchantments-per-order: 5

  # How often expired orders are cleaned up (ticks). 6000 = 5 minutes.
  cleanup-interval-ticks: 6000

  # How should quantity and price be asked for?
  #   SIGN -> a temporary sign appears in front of the player (text: lang -> input.sign)
  #   CHAT -> the player is asked to type in chat (text: lang -> input.chat)
  input-mode: SIGN

  # Items that cannot be ordered.
  blacklist: []
  #  - BEDROCK
  #  - BARRIER

  # Announce to the server when a new order is opened.
  broadcast:
    enabled: false
    # The announcement only triggers for orders above this total (0 = all).
    # Prevents small orders from flooding chat.
    min-total: 0

# =============================================================================
#  TAX
# =============================================================================
#  ###  TO DISABLE ENTIRELY:  enabled: false  ###
#  While disabled, no menu shows a tax line and no money is ever deducted.
#  Default is ON; setting the rate to 0 also results in no money being deducted.
#
#  RATES ARE WRITTEN AS PERCENTAGES:  5.0 = 5%   (NOT the 0.05 format from
#  2.0 — your old file is converted automatically, you don't need to do
#  anything by hand.)
# =============================================================================
tax:
  enabled: true

  # Tax taken when creating an order. Added ON TOP of the order total.
  creation-percent: 5.0

  # Tax deducted on the way to the player when an order completes and pays
  # out. 0.0 = disabled.
  delivery-percent: 0.0

  # Tax deducted from a "sell all" action. 0.0 = disabled.
  sell-percent: 0.0

  # ---------------------------------------------------------------------------
  # TAX RATE BY RANK
  # Left: permission node, right: that rank's tax PERCENTAGE.
  # The LOWEST rate applies — a second rank permission never penalises a player.
  # ---------------------------------------------------------------------------
  rank-rates:
    orders.rank.vip: 4.0
    orders.rank.mvp: 3.0
    orders.rank.elite: 2.0
    orders.rank.legend: 0.0

  # ---------------------------------------------------------------------------
  # TAX DISCOUNT BY RANK (alternative / additional method)
  # PERCENTAGE DISCOUNT off the base tax. The HIGHEST discount applies.
  # Example: 5% base + 40 discount -> 3%
  # If used together with rank-rates, rank-rates is applied first, then the
  # discount.
  # Leave this section empty if you don't want to use it: rank-discounts: {}
  # ---------------------------------------------------------------------------
  rank-discounts:
    orders.rank.vip: 20.0
    orders.rank.mvp: 40.0

  # Permission that removes tax entirely.
  exempt-permission: "orders.tax.exempt"

  # Where should the collected tax go?
  #   VOID    -> it vanishes (reduces the money supply, recommended)
  #   ACCOUNT -> it is deposited into the player account below
  destination: VOID
  destination-account: ""

  # Absolute lower / upper bound. -1 = no bound.
  # The lower bound only applies when tax would already be charged; if the
  # rate is 0%, no money is deducted regardless.
  min-amount: -1
  max-amount: -1

# =============================================================================
#  FEATURES
#  Turning off a feature also removes its buttons entirely.
# =============================================================================
features:
  # Potion orders (including the type-selection menu)
  potions: true
  # Ordering an item with chosen enchantments
  enchantments: true
  # Enchanted book orders
  enchanted-books: true
  # The "sell all" button on the collection screen
  sell-all: true
  # The "quick fill" button on the delivery screen
  quick-fill: true
  # Search on the main menu
  search: true
  # Filter on the main menu
  filter: true
  # Sort on the main menu
  sort: true

  # The list the admin panel's "Features" button cycles through, toggling
  # each on/off. You can add or remove entries here without recompiling;
  # every entry must match one of the keys above.
  panel-toggles:
    - potions
    - enchantments
    - enchanted-books
    - sell-all
    - quick-fill
    - search
    - filter
    - sort

# =============================================================================
#  SOUNDS
# =============================================================================
#  Uses vanilla sound keys (like ui.button.click, not UPPER_CASE).
#  Vanilla names are used instead of the enum because sounds that get
#  renamed between Minecraft versions won't break the plugin.
#
#  FORMAT:  "key"  |  "key:volume"  |  "key:volume:pitch"  |  "none"
#    volume  0.0 - 1.0 (default 1.0)
#    pitch   0.5 - 2.0 (default 1.0)
#  Example:  "block.note_block.pling:0.6:1.8"
#
#  Per-button sounds live in menus/*.yml and OVERRIDE the ones here.
#  If a button doesn't specify its own sound, the matching event sound below
#  plays instead.
#  sounds.enabled: false turns off all sounds.
# =============================================================================
sounds:
  enabled: true

  events:
    # On error messages
    error: "block.note_block.bass:1.0:0.8"
    # General success feedback
    success: "entity.experience_orb.pickup:1.0:1.0"
    # Order created
    order-created: "entity.player.levelup:0.6:1.4"
    # Item delivered to an order
    order-delivered: "entity.experience_orb.pickup:1.0:1.2"
    # Order cancelled
    order-cancelled: "block.note_block.bass:1.0:0.6"
    # Order fully filled
    order-completed: "ui.toast.challenge_complete:1.0:1.0"
    # Page turn (when a button doesn't specify its own sound)
    page-turn: "item.book.page_turn:1.0:1.0"
    # Menu opening (when the menu file doesn't specify open-sound)
    menu-open: "none"
    # Menu closing. NOTE: this also fires when moving from one menu to
    # another, which is why the default is "none".
    menu-close: "none"
    # Level up
    level-up: "ui.toast.challenge_complete:1.0:1.0"
    # When tax is deducted
    tax-paid: "entity.villager.yes:0.7:1.0"
    # When there isn't enough money
    no-money: "entity.villager.no:1.0:1.0"

# =============================================================================
#  CUSTOM ITEMS
# =============================================================================
#  ItemsAdder / Oraxen / Nexo items and vanilla items with custom model data
#  can be ordered. The plugins are NOT COMPILE DEPENDENCIES: a provider that
#  isn't installed is silently skipped, and the plugin still works even if
#  none of them are installed.
#
#  Identifier format:  provider:key
#    itemsadder:ruby          oraxen:mythic_sword       nexo:magic_wand
#    cmd:DIAMOND_SWORD:10001  (resource-pack model, requires no plugin)
# =============================================================================
custom-items:
  enabled: true

  providers:
    itemsadder: true
    oraxen: true
    nexo: true
    # Vanilla items distinguished by custom-model-data
    custom-model-data: true

  # Where should custom items appear in the item-selection menu?
  #   TOP     -> at the start of the list
  #   BOTTOM  -> at the end of the list
  #   MIXED   -> in normal order
  placement: TOP

  # Only these items may be ordered (empty = everything is allowed)
  whitelist: []
  #  - "itemsadder:ruby"

  # These items cannot be ordered
  blacklist: []

  # How strict matching is during delivery:
  #   STRICT -> custom id + name + model data must all match
  #   LOOSE  -> only the custom id needs to match (a renamed item is accepted)
  match-mode: STRICT

# =============================================================================
#  TEXT FORMATTING (MINIFONT)
# =============================================================================
#  Turns text into "ꜱᴍᴀʟʟ ᴄᴀᴘꜱ" style. Colour codes (&a, &#RRGGBB) and
#  placeholder NAMES (%player%) are never changed.
#
#  The conversion happens BEFORE placeholders are substituted: the fixed
#  label is turned into small caps, while the player name / price / item name
#  written into it stays readable.
#  Example:  "&eOwner: &f%player%"  ->  "&eᴏᴡɴᴇʀ: &fSteve"
#
#  This setting applies to ALL LANGUAGES; you don't need to set it separately
#  in each language file.
# =============================================================================
text:
  # Currency. Used to be hard-coded as "$" and couldn't be changed.
  currency:
    symbol: "$"
    # true -> "100$"   false -> "$100"
    after-amount: false

  minifont:
    # Button names (any text whose language key is *.buttons.*)
    buttons: true
    # Menu titles (any text whose language key is menus.*)
    titles: true
    # Button descriptions / lore (any text whose language key is *.lore.*).
    # Having the button name in small caps while its description is normal
    # looks inconsistent, so this defaults to ON.
    lore: true
    # Chat messages. These are long sentences; converting them to small caps
    # makes them harder to read, so this defaults to OFF.
    messages: false

    # Letter table. Left: normal letter (single character), right: the
    # form to display. DELETING a line leaves that letter unchanged.
    # The Turkish letters ğ ş ç ö ü ı have NO Unicode small-caps equivalent;
    # the closest available forms are used below. Delete those lines if you
    # don't like them.
    map:
      a: "ᴀ"
      b: "ʙ"
      c: "ᴄ"
      d: "ᴅ"
      e: "ᴇ"
      f: "ꜰ"
      g: "ɢ"
      h: "ʜ"
      i: "ɪ"
      j: "ᴊ"
      k: "ᴋ"
      l: "ʟ"
      m: "ᴍ"
      n: "ɴ"
      o: "ᴏ"
      p: "ᴘ"
      q: "ǫ"
      r: "ʀ"
      s: "ѕ"
      t: "ᴛ"
      u: "ᴜ"
      v: "ᴠ"
      w: "ᴡ"
      x: "x"
      y: "ʏ"
      z: "ᴢ"
      "ı": "ɪ"
      "ğ": "ɢ"
      "ü": "ᴜ"
      "ş": "ѕ"
      "ö": "ᴏ"
      "ç": "ᴄ"

  # Progress bar in an order item's lore.
  # Used by the %bar% placeholder inside gui.order-lore.template.
  progress-bar:
    length: 10
    filled-char: "■"
    empty-char: "■"
    filled-color: "&#49F267"
    empty-color: "&#555555"

  # Format of the numbers (price, amount, payout...) in an order's lore.
  number-format:
    # full  = 5.000 / 45.000.000   (thousands-separated, whole number)
    # compact = 5K / 45M           (shortened; same as TextUtil.formatNumber)
    style: full
    # Thousands separator for the "full" style. If there are decimals and
    # the separator is ".", "," is used instead.
    thousands-separator: "."
    decimals: 0
    # Percent format. %s is replaced by the number. Turkish writes %0,
    # English writes 0%.
    percent-format: "%%%s"

# =============================================================================
#  SPAM / MACRO PROTECTION
# =============================================================================
#  Every click in the menu makes the server do work: the order list is
#  filtered, sorted, and 54 items are rebuilt. An auto-clicking macro can
#  trigger this dozens of times per second.
#
#  VALUES ARE IN MILLISECONDS.  0 = that check is DISABLED.
#  To disable everything, set everything to 0; there's no separate "enabled"
#  key so you never end up in the confusing state of "on, but all delays 0".
#
#  A player with the bypass-permission never hits any of these waits (admins).
# =============================================================================
protection:
  # Every click inside a menu. 200 = at most 5 clicks per second.
  # The delivery screen's item area is EXCLUDED from this: the player moves
  # items from their own inventory there, and subjecting every move to a
  # cooldown would make the menu unusable.
  click-cooldown-ms: 200

  # Opening a menu.
  menu-cooldown-ms: 250

  # /order and other commands.
  command-cooldown-ms: 1000

  # Creating a new order. Every order is written to the database and
  # refreshes everyone's list, so this one is longer.
  create-cooldown-ms: 3000

  # Delivering an item to an order.
  deliver-cooldown-ms: 500

  # Requesting chat/sign input.
  input-cooldown-ms: 500

  # Should a blocked player be told "you're going too fast"?
  warn-player: true
  # The warning's own interval. Sending it on every block would spam chat
  # instead of preventing spam.
  warn-cooldown-ms: 3000

  # A player with this permission never hits any of these waits.
  bypass-permission: "orders.bypass.cooldown"

# =============================================================================
#  PERFORMANCE
# =============================================================================
performance:
  # Delay before writing to data.yml (ticks). Applies in MEMORY/SQLITE mode.
  #
  #  It used to be that ALL orders (including every item inside them) were
  #  rewritten from scratch on the main thread on every create/cancel/deliver
  #  action. Now changes are batched into a single write, and the file write
  #  happens in the background.
  #
  #  0 = no delay (write immediately on every change - old behaviour).
  #  40 = 2 seconds. Increasing this increases how much of the last few
  #  seconds is lost if the server crashes.
  save-delay-ticks: 40

  # How many ticks before chat input (orders.input-mode: CHAT) times out.
  # 1200 = 60 seconds.
  chat-input-timeout-ticks: 1200

# =============================================================================
#  CROSS-SERVER
# =============================================================================
#  A player opens an order on Survival, delivers it on Skyblock.
#
#  REQUIREMENT: EVERY server on the network must use THE SAME database
#  (storage.type: MYSQL or MARIADB). If you enable this with MEMORY/SQLITE,
#  the plugin prints a clear error on startup and turns synchronisation off —
#  staying disabled is better than silently working incorrectly.
# =============================================================================
network:
  enabled: false

  # This server's name on the network. MUST BE DIFFERENT ON EACH SERVER.
  # If left empty, server.properties -> server-name is used.
  server-id: ""

  # Synchronisation method. Currently only POLL is supported (requires no
  # extra software).
  mode: POLL

  poll:
    # How many ticks between scans. 40 = 2 seconds.
    interval-ticks: 40
    # Maximum number of events processed in a single scan (protects against
    # sudden load spikes).
    batch-size: 200

  # Show which server an order came from in the order list?
  show-server-tag: true

  # A server is considered "offline" if it hasn't reported in for this many
  # seconds.
  heartbeat-timeout: 30

# =============================================================================
#  DATA STORAGE
# =============================================================================
storage:
  # Types: MEMORY, SQLITE, MYSQL, MARIADB
  #   MEMORY  = YAML file storage (data.yml) - default
  #   SQLITE  = local database, no external server required
  #   MYSQL   = MySQL
  #   MARIADB = MariaDB - recommended for production
  type: MEMORY

  sqlite:
    file-path: "orders.db"
    table-prefix: "donutorders_"

  database:
    host: "localhost"
    port: 3306
    database: "minecraft"
    username: "root"
    password: ""
    table-prefix: "donutorders_"

    # HikariCP connection pool
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
