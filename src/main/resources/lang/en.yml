# -----------------------------------------------------------------------------#
#  DonutOrders - English language file                                          #
# -----------------------------------------------------------------------------#
#
#  Every piece of text the plugin can show lives here. lang/en.yml is the
#  canonical file: any key a translation forgets falls back to this one, so a
#  half-finished translation never leaves a player staring at a raw key.
#
#  Colours:  &a &b &c ... and hex &#00d271
#  Placeholders:
#    {prefix}   prefix from config.yml
#    %player%   player name          %seller%  deliverer name
#    %amount%   amount               %item%    item name
#    %price%    price                %total%   total price
#    %limit%    limit                %page%    current page
#    %pages%    total pages          %search%  search text
#
#  Adding your own language: copy this file to lang/<code>.yml (e.g. lang/de.yml)
#  and translate it. It is picked up automatically - no code change needed.
# -----------------------------------------------------------------------------#

