# -----------------------------------------------------------------------------#
#  DonutOrders - Türkçe dil dosyası                                             #
# -----------------------------------------------------------------------------#
#
#  Eklentinin gösterdiği HER metin bu dosyada. Menü başlıkları, buton isimleri,
#  tabela istemleri, eşya/büyü/iksir adları dahil hiçbir metin kodun içinde
#  sabit değil; hepsini buradan değiştirebilirsiniz.
#
#  Renkler:  &a &b &c ... ve hex &#00d271
#  Yer tutucular:
#    {prefix}   config.yml'deki ön ek
#    %player%   oyuncu adı           %seller%  teslim eden
#    %amount%   miktar               %item%    eşya adı
#    %price%    fiyat                %total%   toplam fiyat
#    %limit%    limit                %page%    bulunulan sayfa
#    %pages%    toplam sayfa         %search%  arama metni
#
#  Kendi dilinizi eklemek: bu dosyayı lang/<kod>.yml olarak kopyalayıp çevirin
#  (örn. lang/de.yml). Otomatik olarak tanınır, kod değişikliği gerekmez.
# -----------------------------------------------------------------------------#

