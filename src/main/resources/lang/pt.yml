# -----------------------------------------------------------------------------#
#  DonutOrders - Portugues (pt)
# -----------------------------------------------------------------------------#
#
#  Arquivo de idioma portugues. Livremente editavel.
#
#  Colours: &a &b &c ... and hex &#00d271
#  Placeholders: {prefix} %player% %seller% %amount% %item% %price% %total%
#                %limit% %page% %pages% %search% %filter% %time% %language%
#
#  Any key missing here falls back to lang/en.yml, so an unfinished
#  translation never shows a raw key to a player.
#
#  This file is never overwritten on update; only missing keys are added.
# -----------------------------------------------------------------------------#

