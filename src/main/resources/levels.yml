# -----------------------------------------------------------------------------#
#  DonutOrders — Order Level                                                    #
# -----------------------------------------------------------------------------#
#
#  Players earn XP as they create and deliver orders. As they level up they
#  pay less tax, can hold more active orders at once, and can request more
#  items per order.
#
#  ###  TO DISABLE ENTIRELY:  enabled: false  ###
#  While disabled, the level button never appears in the /order menu, no XP
#  is ever processed, the save file is never read, and the tax calculation
#  never even asks about level. Zero cost.
#
#  NO NUMBER IN THIS FILE IS HARD-CODED:
#    * The number of levels is free — write 3 levels or 80.
#    * Each XP source is separate; set the one you don't want to 0 to disable it.
#    * If a level's config doesn't list a bonus, that bonus is 0 at that level.
#    * The button's location is in menus/main-menu.yml -> items.level.
#
#  After changing anything: /donutordersadmin reload
# -----------------------------------------------------------------------------#

enabled: true

# =============================================================================
#  HOW XP IS EARNED
#  Setting an entry to 0 disables XP from that source.
# =============================================================================
xp:
  # Creating an order (flat)
  on-create: 5.0
  # Extra XP per 1000 currency spent when creating an order
  on-create-per-1000: 1.0
  # Per ITEM delivered to someone else's order
  on-deliver-per-item: 0.25
  # When your own order becomes fully filled (flat)
  on-complete: 10.0
  # Per 1000 currency earned via "sell all"
  on-sell-per-1000: 0.5

# Daily XP cap. -1 = unlimited.
# The counter resets 24 hours after the player's first XP gain.
daily-cap: -1

# =============================================================================
#  ABUSE PROTECTION  (XP farming between friends)
# =============================================================================
#  The level system rewards "economic activity". But two friends can level
#  each other up without producing any real economic activity at all. The
#  exploits this closes:
#
#   1) WASH TRADING: A opens an order for 1 dirt, B fills it, then they swap
#      roles. Money moves back and forth between the two players and both
#      earn XP. A macro can repeat this hundreds of times per minute.
#   2) ALT ACCOUNT: The same person sets up the same loop with a second
#      account; no money is ever lost, and XP is doubled.
#   3) OPEN-AND-CANCEL: Opening an order grants XP, and cancelling it refunds
#      the money IN FULL. If tax is 0, that's free, unlimited XP.
#   4) HUGE ORDER + CANCEL: Since XP scales with money, opening a 10-million
#      order and immediately cancelling it grants a level in a single move.
#   5) SPLITTING: Opening 64 one-item orders instead of a single 64-item
#      order to multiply the flat "order creation" XP.
#
#  ###  TO DISABLE ENTIRELY:  enabled: false  ###
#  Each item can also be disabled individually. A disabled check has no cost.
# =============================================================================
anti-abuse:
  enabled: true

  # ---------------------------------------------------------------------------
  # WHEN ORDER-CREATION XP IS GRANTED   (fully closes exploits 3 and 4)
  #
  #   ON_COMPLETE  -> paid once the order is ACTUALLY filled (recommended, default)
  #   IMMEDIATE    -> paid the moment the order is opened     (old behaviour)
  #
  # ON_COMPLETE requires no record-keeping at all: even if the server
  # restarts, the exploit doesn't come back. It rewards the "outcome", not
  # the "intent" — an order that was opened and immediately cancelled
  # produced nothing.
  # ---------------------------------------------------------------------------
  creation-xp-mode: ON_COMPLETE

  # ---------------------------------------------------------------------------
  # PARTNER LIMIT   (exploit 1: endlessly repeated trades with the same person)
  #
  # Instead of banning it outright, this gradually DEVALUES it. Two friends
  # genuinely trading with each other is legitimate; repeating it endlessly
  # is not.
  # ---------------------------------------------------------------------------
  partner-limit:
    enabled: true

    # At least this many seconds must pass between two XP-earning trades with
    # the same person. Trades within this window still go through but grant
    # no XP.
    cooldown-seconds: 60

    # How many of the first trades grant FULL XP.
    full-reward-count: 3

    # The multiplier for every trade after that. 0.5 = halved each time.
    #   4th trade 50%, 5th 25%, 6th 12.5% ... drops to 0 once it falls below 1%.
    # Set to 1.0 for no decay (only the cooldown and cap apply).
    decay: 0.5

    # Maximum XP earnable from a single partner in 24 hours. -1 = unlimited.
    daily-xp-cap: 100

    # How long trade history is remembered (hours).
    window-hours: 24

  # ---------------------------------------------------------------------------
  # ALT ACCOUNT   (exploit 2)
  # ---------------------------------------------------------------------------
  # No XP is granted if the deliverer and the order owner share the SAME IP
  # address.
  # NOTE: this also affects siblings playing from the same house. If that's
  # common on your server, set this to false; delivery will still work, it
  # just won't grant XP.
  block-same-ip: true

  # Delivering to your own order (already blocked normally) should never
  # grant XP under any circumstance.
  block-self-delivery: true

  # ---------------------------------------------------------------------------
  # MINIMUM ORDER SIZE   (exploit 5: multiplying tiny orders by splitting them)
  # ---------------------------------------------------------------------------
  # Orders BELOW these values produce no XP at all (neither for the creator
  # nor the deliverer).
  # 0 = that check is disabled.
  min-order-value: 100      # order total (quantity x price)
  min-order-amount: 16      # number of items ordered

  # Log blocked XP attempts to the console? (for admin monitoring)
  log-suspicious: true

# =============================================================================
#  LEVELS
#  Add or remove as many as you like. A level you delete will NOT come back
#  on update.
#
#    xp-required     TOTAL xp required to reach this level
#    tax-discount    percentage discount off tax (0-100)
#    extra-orders    added to the active-order limit
#    extra-items     added to the number of items requestable per order
#    reward-commands run on the console on level-up (%player%, %level%)
#    broadcast       if true, announced to the server
# =============================================================================
levels:
  1:
    xp-required: 0
    tax-discount: 0
    extra-orders: 0
    extra-items: 0
    reward-commands: []
    broadcast: false
  2:
    xp-required: 100
    tax-discount: 5
    extra-orders: 2
    extra-items: 64
    reward-commands: []
    broadcast: false
  3:
    xp-required: 300
    tax-discount: 10
    extra-orders: 5
    extra-items: 192
    reward-commands: []
    broadcast: false
  4:
    xp-required: 750
    tax-discount: 15
    extra-orders: 10
    extra-items: 384
    reward-commands: []
    broadcast: true
  5:
    xp-required: 1500
    tax-discount: 20
    extra-orders: 15
    extra-items: 640
    reward-commands: []
    broadcast: true
  6:
    xp-required: 3000
    tax-discount: 25
    extra-orders: 25
    extra-items: 1280
    reward-commands: []
    broadcast: true
  7:
    xp-required: 6000
    tax-discount: 30
    extra-orders: 40
    extra-items: 2560
    reward-commands: []
    broadcast: true
  8:
    xp-required: 12000
    tax-discount: 40
    extra-orders: 60
    extra-items: 5120
    reward-commands: []
    broadcast: true

# =============================================================================
#  APPEARANCE
# =============================================================================
# Progress bar (the %bar% placeholder)
progress-bar:
  length: 20
  filled-char: "|"
  empty-char: "|"
  filled-color: "&a"
  empty-color: "&7"

# The title shown on screen when a player levels up.
# Text: lang/<language>.yml -> level.up-title / level.up-subtitle
# Sound: config.yml -> sounds.events.level-up
level-up-title:
  enabled: true
  fade-in: 10
  stay: 40
  fade-out: 10
