# -----------------------------------------------------------------------------#
#  New order creation menu                                                      #
# -----------------------------------------------------------------------------#
#  See the note at the top of menus/main-menu.yml for a description of the fields.
#
#  The material of the "item" button is the item the player selected; the
#  material field here is only used while nothing has been selected yet.
# -----------------------------------------------------------------------------#

rows: 3
title: ""
content-slots: ""
open-sound: "none"

# Sound played when the menu closes. This also triggers when switching from
# one menu to another, which is why the default is "none" (config.yml -> sounds.events.menu-close).
close-sound: "none"

filler:
  enabled: false
  material: GRAY_STAINED_GLASS_PANE
  name: " "
  # If true, the filler fills the slot even if a button sits on it.
  # If false (default), buttons are preserved — this must stay false so the
  # page/back/search buttons in the bottom row don't disappear.
  overwrite: false

items:
  cancel:
    enabled: true
    slot: 10
    material: RED_STAINED_GLASS_PANE
    sound: "ui.button.click"

  item:
    enabled: true
    slot: 12
    material: STONE
    sound: "ui.button.click"

  amount:
    enabled: true
    slot: 13
    material: CHEST
    sound: "ui.button.click"

  price:
    enabled: true
    slot: 14
    material: EMERALD
    sound: "ui.button.click"

  confirm:
    enabled: true
    slot: 16
    material: LIME_STAINED_GLASS_PANE
    sound: "entity.experience_orb.pickup"
