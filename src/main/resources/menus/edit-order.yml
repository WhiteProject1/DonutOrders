# -----------------------------------------------------------------------------#
#  Edit order menu                                                              #
# -----------------------------------------------------------------------------#
#  See the note at the top of menus/main-menu.yml for a description of the fields.
#
#  When an order is completed, the "cancel-order" button is removed and
#  "collect-items" takes its place — this behavior is hardcoded, so set the slots accordingly.
# -----------------------------------------------------------------------------#

rows: 3
title: ""
content-slots: ""
open-sound: "none"

# Sound played when the menu closes. This also triggers when switching from
# one menu to another, which is why the default is "none" (config.yml -> sounds.events.menu-close).
close-sound: "none"

filler:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "
  slots: "0, 1, 2, 9, 11, 18, 19, 20"
  # If true, the filler fills the slot even if a button sits on it.
  # If false (default), buttons are preserved — this must stay false so the
  # page/back/search buttons in the bottom row don't disappear.
  overwrite: false

items:
  order:
    enabled: true
    slot: 10
    material: STONE

  cancel-order:
    enabled: true
    slot: 13
    material: RED_TERRACOTTA
    sound: "block.anvil.land"

  collect-items:
    enabled: true
    slot: 15
    material: CHEST
    sound: "ui.button.click"

  back:
    enabled: true
    slot: 26
    material: RED_STAINED_GLASS_PANE
    sound: "ui.button.click"
