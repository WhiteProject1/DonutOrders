# -----------------------------------------------------------------------------#
#  Enchantment picker menu                                                      #
# -----------------------------------------------------------------------------#
#  See the note at the top of menus/main-menu.yml for a description of the fields.
#
#  content-slots is where the enchanted books are laid out; however many you
#  set, that many enchantments are shown per page. "preview" is a preview of
#  the item together with the selected enchantments.
#
#  This menu never opens if config.yml -> features.enchantments is off.
# -----------------------------------------------------------------------------#

rows: 6
title: ""
content-slots: "2-8, 11-17, 20-26, 29-35, 38-44"
open-sound: "none"

# Sound played when the menu closes. This also triggers when switching from
# one menu to another, which is why the default is "none" (config.yml -> sounds.events.menu-close).
close-sound: "none"

filler:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "
  slots: "1, 9, 10, 45-53"
  # If true, the filler fills the slot even if a button sits on it.
  # If false (default), buttons are preserved — this must stay false so the
  # page/back/search buttons in the bottom row don't disappear.
  overwrite: false

items:
  preview:
    enabled: true
    slot: 0
    material: STONE

  previous-page:
    enabled: true
    slot: 45
    material: ARROW
    sound: "ui.button.click"

  cancel:
    enabled: true
    slot: 46
    material: RED_STAINED_GLASS_PANE
    sound: "ui.button.click"

  confirm:
    enabled: true
    slot: 52
    material: LIME_STAINED_GLASS_PANE
    sound: "entity.experience_orb.pickup"

  next-page:
    enabled: true
    slot: 53
    material: ARROW
    sound: "ui.button.click"
