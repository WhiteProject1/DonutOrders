# -----------------------------------------------------------------------------#
#  Language selection menu — /orderlang                                         #
# -----------------------------------------------------------------------------#
#  See the note at the top of menus/main-menu.yml for a description of the fields.
#
#  content-slots is where languages are laid out. If you add a new language
#  file to the lang/ folder, it appears here automatically. Languages that don't
#  fit move to the NEXT PAGE — they are never lost. The plugin ships with 13
#  languages, so the default 21 slots are enough, which is why the page arrows
#  come disabled by default. Enable them if you add more languages.
#
#  Each language's icon comes from the icons section below.
#  This menu does not open if config.yml -> per-player-language is off.
# -----------------------------------------------------------------------------#

rows: 5
title: ""
content-slots: "10-16, 19-25, 28-34"
open-sound: "none"

# Sound played when the menu closes. This also triggers when switching from
# one menu to another, which is why the default is "none" (config.yml -> sounds.events.menu-close).
close-sound: "none"

filler:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "
  # If true, the filler fills the slot even if a button sits on it.
  # If false (default), buttons are preserved — this must stay false so the
  # page/back/search buttons in the bottom row don't disappear.
  overwrite: false

# Language code -> icon material. The default is used for a language not in the list.
icons:
  default: PAPER
  tr: RED_BANNER
  en: WHITE_BANNER
  de: YELLOW_BANNER
  es: ORANGE_BANNER
  fr: BLUE_BANNER
  it: GREEN_BANNER
  pt: LIME_BANNER
  ru: LIGHT_BLUE_BANNER
  pl: PINK_BANNER
  nl: ORANGE_WOOL
  cs: LIGHT_GRAY_BANNER
  zh: RED_WOOL
  ja: WHITE_WOOL

items:
  # Disabled by default since 13 languages fit on a single page. If you add
  # your own language and go over 21, set enabled: true — the slots are already in place.
  previous-page:
    enabled: false
    slot: 39
    material: ARROW
    sound: "ui.button.click"

  back:
    enabled: true
    slot: 40
    material: BARRIER
    sound: "ui.button.click"

  next-page:
    enabled: false
    slot: 41
    material: ARROW
    sound: "ui.button.click"
