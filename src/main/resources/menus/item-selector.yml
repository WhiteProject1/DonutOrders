# -----------------------------------------------------------------------------#
#  Item selector menu                                                           #
# -----------------------------------------------------------------------------#
#  See the note at the top of menus/main-menu.yml for a description of the fields.
#
#  The page number in the title comes from the menus.item-selector text in the
#  language file and uses the %page% / %pages% placeholders.
# -----------------------------------------------------------------------------#

rows: 6
title: ""
content-slots: "0-44"
open-sound: "none"

# Sound played when the menu closes. This also triggers when switching from
# one menu to another, which is why the default is "none" (config.yml -> sounds.events.menu-close).
close-sound: "none"

filler:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "
  slots: "45-53"
  # If true, the filler fills the slot even if a button sits on it.
  # If false (default), buttons are preserved — this must stay false so the
  # page/back/search buttons in the bottom row don't disappear.
  overwrite: false

items:
  previous-page:
    enabled: true
    slot: 48
    material: ARROW
    sound: "ui.button.click"

  back:
    enabled: true
    slot: 49
    material: BARRIER
    sound: "ui.button.click"

  next-page:
    enabled: true
    slot: 50
    material: ARROW
    sound: "ui.button.click"

  search:
    enabled: true
    slot: 53
    material: OAK_SIGN
    sound: "ui.button.click"
