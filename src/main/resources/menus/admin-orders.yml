# -----------------------------------------------------------------------------#
#  Admin — All orders                                                           #
# -----------------------------------------------------------------------------#
#  See the note at the top of menus/main-menu.yml for a description of the fields.
#
#  EVERY active order on the server is listed here.
#    Left-click       -> prints the order's details to chat
#    SHIFT + right-click -> removes the order and refunds the remaining amount to its owner
#  Removal is deliberately bound to shift+right-click so a single accidental
#  click doesn't delete someone else's order.
# -----------------------------------------------------------------------------#

rows: 6
title: ""
content-slots: "0-44"
open-sound: "none"

close-sound: "none"

filler:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "
  slots: "45-53"
  overwrite: false

items:
  previous-page:
    enabled: true
    slot: 48
    material: ARROW
    sound: "ui.button.click"

  back:
    enabled: true
    slot: 49
    material: BARRIER
    sound: "ui.button.click"

  next-page:
    enabled: true
    slot: 50
    material: ARROW
    sound: "ui.button.click"

  search:
    enabled: true
    slot: 53
    material: OAK_SIGN
    sound: "ui.button.click"
