# -----------------------------------------------------------------------------#
#  Deliver items menu                                                           #
# -----------------------------------------------------------------------------#
#  See the note at the top of menus/main-menu.yml for a description of the fields.
#
#  Here, content-slots is the area "where the player can place items". These
#  slots are free; every slot outside it is locked. To enlarge the area,
#  increase rows and widen content-slots, and remember to shift the button slots too.
# -----------------------------------------------------------------------------#

rows: 4
title: ""
content-slots: "0-26"
open-sound: "none"

# Sound played when the menu closes. This also triggers when switching from
# one menu to another, which is why the default is "none" (config.yml -> sounds.events.menu-close).
close-sound: "none"

filler:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "
  slots: "27-35"
  # If true, the filler fills the slot even if a button sits on it.
  # If false (default), buttons are preserved — this must stay false so the
  # page/back/search buttons in the bottom row don't disappear.
  overwrite: false

items:
  quick-fill:
    enabled: true
    slot: 31
    material: HOPPER
    sound: "entity.item.pickup"
