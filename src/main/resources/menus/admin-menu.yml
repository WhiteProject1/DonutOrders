# -----------------------------------------------------------------------------#
#  Admin panel — /donutordersadmin                                              #
# -----------------------------------------------------------------------------#
#  See the note at the top of menus/main-menu.yml for a description of the fields.
#
#  Setting a button's enabled: false removes that capability from the panel
#  ENTIRELY (the equivalent command still works).
#
#  The features / tax / levels buttons WRITE the corresponding setting to the
#  config when clicked and apply it immediately. If the write fails, the
#  change only applies for that session and a warning is logged to console.
# -----------------------------------------------------------------------------#

rows: 5
title: ""
content-slots: ""
open-sound: "block.chest.open:0.5:1.2"

# Sound played when the menu closes.
close-sound: "none"

filler:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "
  slots: "0-44"
  # The filler never overwrites buttons; a wide range is given here to fill
  # all the empty space in this menu.
  overwrite: false

items:
  reload:
    enabled: true
    slot: 10
    material: REDSTONE
    glow: true
    sound: "block.anvil.use:0.7:1.4"

  orders:
    enabled: true
    slot: 12
    material: CHEST
    sound: "ui.button.click"

  stats:
    enabled: true
    slot: 14
    material: PAPER
    sound: "ui.button.click"

  cleanup:
    enabled: true
    slot: 16
    material: LAVA_BUCKET
    sound: "ui.button.click"

  features:
    enabled: true
    slot: 29
    material: COMPARATOR
    sound: "ui.button.click"

  tax:
    enabled: true
    slot: 31
    material: GOLD_INGOT
    sound: "ui.button.click"

  levels:
    enabled: true
    slot: 33
    material: EXPERIENCE_BOTTLE
    sound: "ui.button.click"

  close:
    enabled: true
    slot: 40
    material: BARRIER
    sound: "ui.button.click"
