# -----------------------------------------------------------------------------#
#  Main order menu — /order                                                     #
# -----------------------------------------------------------------------------#
#
#  THIS FILE CONTROLS LAYOUT, NOT TEXT.
#  Button names and descriptions live in lang/<language>.yml, so each player
#  sees them in their own language. The "name" / "lore" fields here are optional
#  OVERRIDES: if you set them, that text is fixed for everyone (no longer
#  language-dependent).
#
#  Common fields (usable on any button):
#    enabled            true/false — if false, the button is not placed at all
#    slot               a single slot (starts at 0)
#    slots              multiple slots: [45, 46] or "0-44, 53"
#    material           block/item name (e.g. ARROW, CHEST)
#    custom-model-data  resource pack model number (0 = none)
#    glow               if true, adds an enchant glint
#    name               name override (if omitted, comes from the language file)
#    lore               lore override; dynamic lines are still appended below it
#    sound              click sound — "key", "key:volume" or
#                       "key:volume:pitch"  (e.g. "ui.button.click:0.6:1.4")
#    sound-volume       legacy field; applies only if sound has no volume set
#    sound-pitch        legacy field; applies only if sound has no pitch set
#
#  If a button doesn't set sound, the general sound from config.yml ->
#  sounds.events applies instead (e.g. page buttons -> page-turn). The two
#  never play together; the per-button definition always wins.
#
#  To remove a button entirely, either set enabled: false or delete the section.
#  A deleted section will not come back on a version update.
#
#  The FILLER only fills EMPTY slots; it never overwrites buttons.
#  If you want the old behavior, set "overwrite: true" — but then buttons that
#  fall within the filler range become invisible.
#
#  Sound keys are vanilla names (not UPPERCASE enum constants):
#    ui.button.click, block.note_block.pling, entity.experience_orb.pickup,
#    block.anvil.use, entity.villager.yes  ...  set "none" to play no sound.
# -----------------------------------------------------------------------------#

# Number of inventory rows (1-6). Orders per page depends on content-slots.
rows: 6

# Title override. If left blank, menus.main-menu from the language file is used.
# Placeholders: %page% %pages%
title: ""

# Slots where orders are laid out. The size of this range = orders per page.
content-slots: "0-44"

# Sound played when the menu opens.
open-sound: "none"

# Sound played when the menu closes. This also triggers when switching from
# one menu to another, which is why the default is "none" (config.yml -> sounds.events.menu-close).
close-sound: "none"

# Glass pane that fills any slots left empty.
filler:
  enabled: false
  material: GRAY_STAINED_GLASS_PANE
  name: " "
  # If true, the filler fills the slot even if a button sits on it.
  # If false (default), buttons are preserved — this must stay false so the
  # page/back/search buttons in the bottom row don't disappear.
  overwrite: false

items:
  previous-page:
    enabled: true
    slot: 45
    material: ARROW
    sound: "ui.button.click"

  language:
    enabled: true
    slot: 46
    material: BOOK
    sound: "ui.button.click"

  sort:
    enabled: true
    slot: 47
    material: CAULDRON
    sound: "ui.button.click"

  filter:
    enabled: true
    slot: 48
    material: HOPPER
    sound: "ui.button.click"

  refresh:
    enabled: true
    slot: 49
    material: PAPER
    sound: "ui.button.click"

  search:
    enabled: true
    slot: 50
    material: OAK_SIGN
    sound: "ui.button.click"

  your-orders:
    enabled: true
    slot: 51
    material: CHEST
    sound: "ui.button.click"

  # Order level. If levels.yml -> enabled: false, this button is NOT placed
  # at all (the slot stays empty). If you want the system running in the
  # background without the button, set enabled: false here instead.
  level:
    enabled: true
    slot: 52
    material: EXPERIENCE_BOTTLE
    glow: true
    sound: "ui.button.click"

  next-page:
    enabled: true
    slot: 53
    material: ARROW
    sound: "ui.button.click"
